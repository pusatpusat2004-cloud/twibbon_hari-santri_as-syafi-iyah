<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Twibbon Hari Santri Nasional 2026</title>
<style>
  body {

    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

    max-width: 480px;

  }

    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  input[type="text"] {
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
  }
  .btn {
    background: #d4af5a;
    color: #1b1b1b;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type="file"] { font-size: 14px; }
  .hint { font-size: 13px; color: #c9d8d3; margin: 0; }
</style>
